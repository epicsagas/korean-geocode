input {
  http {
    port => 5044
    codec => "json"
  }

  # Prometheus metrics polling (10분마다)
  http_poller {
    urls => {
      metrics => "http://host.docker.internal:8080/metrics"
    }
    request_timeout => 60
    schedule => { every => "10m" }
    codec => "plain"
    metadata_target => "http_poller_metadata"
  }
}

filter {
  # Prometheus metrics 파싱
  if [http_poller_metadata] {
    grok {
      match => { "message" => "%{DATA:metric_name}\{provider=\"%{DATA:provider}\"\} %{NUMBER:value:float}" }
    }

    mutate {
      add_field => { "[@metadata][target_index]" => "geocode-metrics-%{+YYYY.MM.dd}" }
      add_field => { "source" => "prometheus" }
      remove_field => [ "http_poller_metadata", "message" ]
    }
  }

  # JSON 로그 처리
  if [type] == "quota_log" {
    mutate {
      add_field => { "[@metadata][target_index]" => "geocode-logs-%{+YYYY.MM.dd}" }
      add_field => { "source" => "api" }
    }
  }

  # 공통 타임스탬프
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    document_type => "_doc"
  }

  # 디버깅용 (필요시 주석 해제)
  # stdout { codec => rubydebug }
}
