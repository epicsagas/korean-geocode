basePath: /
definitions:
  http.ErrorInfo:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  http.ProviderQuota:
    properties:
      provider:
        type: string
      quota:
        type: integer
      remaining:
        type: integer
      usage:
        type: integer
    type: object
  http.QuotaResponse:
    properties:
      quotas:
        items:
          $ref: '#/definitions/http.ProviderQuota'
        type: array
      timestamp:
        type: string
    type: object
  http.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/http.ErrorInfo'
      meta: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/epicsagas/korean-geocode/issues
  description: "고가용성 하이브리드 Geocoding 서비스 - Google Maps, Kakao Local, vWorld API 통합\n\n##
    주요 특징\n- \U0001F30F 하이브리드 전략: 비용 최적화 + 고가용성\n- \U0001F504 Smart Router: 한글/영문
    자동 감지 및 최적 Provider 선택\n- ⚡ Circuit Breaker: 장애 격리 및 자동 복구\n- \U0001F4CA Rate
    Limiting: 일일 쿼터 관리\n- \U0001F5FA️ WGS84 통일: 모든 좌표계를 WGS84로 정규화\n\n## Provider
    우선순위\n- 한글 주소: Kakao → vWorld → Google\n- 영문 주소: Google → Kakao"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: GeoCoding Hybrid API
  version: "1.0"
paths:
  /health:
    get:
      description: 서버 및 모든 Provider의 상태를 확인합니다. Kubernetes Liveness/Readiness Probe에
        사용할 수 있습니다.
      produces:
      - application/json
      responses:
        "200":
          description: 서버 정상 동작
          schema:
            $ref: '#/definitions/http.Response'
      summary: 서버 상태 확인
      tags:
      - health
  /v1/geocode:
    get:
      consumes:
      - application/json
      description: 입력된 주소를 위도/경도 좌표로 변환합니다. 주소 패턴에 따라 최적의 Provider가 자동으로 선택되며, 실패
        시 자동으로 다른 Provider로 Failover됩니다.
      parameters:
      - description: 검색할 주소 (한글 또는 영문)
        example: 서울특별시 강남구 테헤란로 152
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 성공적으로 좌표를 반환
          schema:
            $ref: '#/definitions/http.Response'
        "400":
          description: 잘못된 요청 (쿼리 파라미터 누락)
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: 서버 내부 오류 또는 모든 Provider 실패
          schema:
            $ref: '#/definitions/http.Response'
        "503":
          description: 서비스 일시 중단 (Circuit Breaker Open)
          schema:
            $ref: '#/definitions/http.Response'
      summary: 주소를 좌표로 변환
      tags:
      - geocoding
  /v1/quota:
    get:
      consumes:
      - application/json
      description: Provider별 현재 쿼터 사용량을 조회합니다
      parameters:
      - description: 특정 Provider 조회 (vworld, kakao, naver, google)
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.QuotaResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.QuotaResponse'
      summary: 쿼터 조회
      tags:
      - quota
schemes:
- http
- https
swagger: "2.0"
tags:
- description: 주소-좌표 변환 API
  name: geocoding
- description: 서버 상태 확인
  name: health
